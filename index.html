<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore global cuisines, food origins, history, and authentic recipes on Foodopedia - the encyclopedia for food lovers around the world.">
  <title>Foodopedia | Global Culinary Encyclopedia</title>
  <script>
    if (!sessionStorage.getItem('foodopedia_current_user')) {
      window.location.href = 'auth.html';
    }
  </script>
  <script type="module" src="js/auth.js"></script>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .hero-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px auto 20px;
      gap: 24px;
      max-width: 800px;
      text-align: center;
    }

    .hero-title {
      font-family: 'Outfit', sans-serif;
      font-size: 38px;
      font-weight: 800;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #ff3b30 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .hero-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin: -12px 0 10px 0;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 580px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      width: 100%;
      background: var(--surface);
      padding: 8px 10px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid var(--border-light);
    }

    .search-row input {
      padding: 12px 20px;
      flex: 1;
      border-radius: 30px;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: inherit;
    }

    .search-row select {
      padding: 12px 36px 12px 20px;
      border-radius: 50px;
      border: 1px solid var(--border-light);
      outline: none;
      font-size: 14px;
      font-family: inherit;
      background: #f8fafc;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }

    .button-row {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .main-btn {
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      background: var(--primary-gradient);
      color: white;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 59, 48, 0.35);
    }

    .main-btn-secondary {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .main-btn-secondary:hover {
      background: #f1f5f9;
      box-shadow: var(--shadow-md);
    }

    /* Suggestions Box */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    }

    .suggestions div {
      padding: 12px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.2s;
    }

    .suggestions div:last-child {
      border-bottom: none;
    }

    .suggestions div:hover {
      background: #f8fafc;
    }

    .suggestions img {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: #f1f5f9;
    }

    .suggestions .suggestion-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .suggestions .suggestion-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .suggestions .suggestion-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

<nav class="main-nav">
  <a href="index.html" class="logo" style="color: inherit; text-decoration: none;">FOODOPEDIA</a>

  <div style="display:flex; align-items:center; gap:16px;">
    <a href="javascript:void(0)" id="download-data-btn" onclick="downloadUserData()" style="color:white; text-decoration:none; font-size:13px; font-weight:600; display:none; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px;">Download Data</a>
    <a href="javascript:void(0)" id="download-feedback-btn" onclick="downloadFeedbackData()" style="color:white; text-decoration:none; font-size:13px; font-weight:600; display:none; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px;">Download Feedback</a>
    <a href="account.html" class="account-circle" title="My Account">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </a>
    <a href="like.html" class="like-icon" title="Favorites">
      ❤️
      <span id="like-count">0</span>
    </a>
  </div>
</nav>

<div class="hero-section">
  <h1 class="hero-title">Discover Cuisines & Flavors</h1>
  <p class="hero-subtitle">Explore authentic dishes, ingredients, and food origins from around the globe</p>

  <div class="search-wrapper">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search dish by name or ingredient...">
      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="Veg">🟢 Veg</option>
        <option value="Non-Veg">🔴 Non-Veg</option>
        <option value="Both">🟡 Both</option>
      </select>
    </div>

    <div class="suggestions" id="suggestions"></div>
  </div>

  <div class="button-row">
    <button class="main-btn" onclick="applySearch()">Search Dishes</button>
    <button class="main-btn main-btn-secondary" onclick="goCuisine()">Explore Cuisines</button>
  </div>
</div>

<div class="card-container" id="results"></div>

<footer>
  <p>© 2026 Foodopedia. Crafted for food lovers worldwide.</p>
</footer>

<script src="js/data.js"></script>

<script type="module">

const searchInput = document.getElementById("searchInput");
const typeFilter = document.getElementById("typeFilter");
const suggestionsBox = document.getElementById("suggestions");
const resultsContainer = document.getElementById("results");

/* Show suggestions while typing */
searchInput.addEventListener("input", function(){

  const value = searchInput.value.toLowerCase();

  if(value === ""){
    suggestionsBox.style.display = "none";
    return;
  }

  let matched = [];
  foods.forEach(f => {
    if (f.name.toLowerCase().includes(value)) {
      matched.push({
        name: f.name,
        image: getImagePath(f.images),
        type: f.type,
        cuisine: f.cuisine
      });
    }
    if (f.variations) {
      f.variations.forEach(v => {
        if (v.name.toLowerCase().includes(value)) {
          matched.push({
            name: v.name,
            image: getImagePath(v.images),
            type: f.type,
            cuisine: f.cuisine
          });
        }
      });
    }
  });

  // Remove duplicates by name
  const seen = new Set();
  matched = matched.filter(el => {
    const duplicate = seen.has(el.name);
    seen.add(el.name);
    return !duplicate;
  }).slice(0, 6);

  if(matched.length === 0){
    suggestionsBox.style.display = "none";
    return;
  }

  suggestionsBox.innerHTML = matched.map(item => `
    <div onclick="selectSuggestion('${item.name.replace(/'/g, "\\'")}')">
      <img src="${item.image}" loading="lazy" decoding="async" onerror="this.src=window.getImagePath([])">
      <div class="suggestion-info">
        <span class="suggestion-name">${item.name}</span>
        <span class="suggestion-meta">${item.cuisine} • ${item.type || ''}</span>
      </div>
    </div>
  `).join("");

  suggestionsBox.style.display = "block";
});

function selectSuggestion(name){
  searchInput.value = name;
  suggestionsBox.style.display = "none";
  applySearch();
}

function applySearch(){

  suggestionsBox.style.display = "none";

  const searchVal = searchInput.value.toLowerCase();
  const typeVal = typeFilter.value;

  let filtered = [];
  foods.forEach(f => {
    // Check main dish
    if (f.name.toLowerCase().includes(searchVal)) {
      if (typeVal === "all" || f.type === typeVal) {
        filtered.push(f);
      }
    }
    
    // Check variations
    if (f.variations) {
      f.variations.forEach(v => {
        if (v.name.toLowerCase().includes(searchVal)) {
          if (typeVal === "all" || f.type === typeVal) {
            if (!filtered.find(item => item.id === v.id)) {
              filtered.push({...v, type: f.type, cuisine: f.cuisine});
            }
          }
        }
      });
    }
  });

  renderResults(filtered);
}

function renderResults(list){

  if(list.length === 0){
    resultsContainer.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color: var(--text-muted); font-size:16px;'>No dishes found matching your search criteria.</p>";
    return;
  }

  let likedItems = getLikedFoods();

  resultsContainer.innerHTML = list.map(f => {
    const isLiked = likedItems.includes(f.id);

    return `
      <div class="card">
        <span 
          class="like-btn ${isLiked ? 'liked' : 'not-liked'}"
          onclick="toggleLike(${f.id}, event)">
          <svg viewBox="0 0 24 24" class="heart-icon ${isLiked ? 'liked' : ''}">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </span>

        <div onclick="window.location.href='food.html?id=${f.id}'">
          <img src="${getImagePath(f.images)}" loading="lazy" decoding="async" onerror="this.src=window.getImagePath([])" alt="${f.name}">
          <h3>${f.name}</h3>
        </div>
      </div>
    `;
  }).join("");
}

function goCuisine(){
  window.location.href = "cuisine.html";
}

window.applySearch = applySearch;
window.selectSuggestion = selectSuggestion;
window.goCuisine = goCuisine;

// Auto-load all dishes on initial load
renderResults(foods);

</script>

</body>
</html>
