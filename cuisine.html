<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore world cuisines - Italian, Indian, Japanese, Mexican, French and more on Foodopedia.">
  <title>Cuisines of the World | Foodopedia</title>
  <script>
    if (!sessionStorage.getItem('foodopedia_current_user')) {
      window.location.href = 'auth.html';
    }
  </script>
  <script type="module" src="js/auth.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cuisine-header {
      max-width: 1280px;
      margin: 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .cuisine-title {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 800;
      margin: 0;
      color: var(--text-main);
    }

    .filter-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .filter-bar input {
      padding: 10px 18px;
      border-radius: 30px;
      border: 1px solid var(--border-light);
      outline: none;
      font-size: 14px;
      font-family: inherit;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      min-width: 220px;
    }

    .filter-bar select {
      padding: 10px 32px 10px 18px;
      border-radius: 50px;
      border: 1px solid var(--border-light);
      outline: none;
      font-size: 14px;
      font-family: inherit;
      background: var(--surface);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border-light);
    }
  </style>
</head>

<body>

  <nav class="main-nav">
    <a href="index.html" class="logo" style="color: inherit; text-decoration: none;">FOODOPEDIA</a>

    <div style="display:flex; align-items:center; gap:16px;">
      <a href="javascript:void(0)" id="download-data-btn" onclick="downloadUserData()"
        style="color:white; text-decoration:none; font-size:13px; font-weight:600; display:none; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px;">Download Data</a>
      <a href="javascript:void(0)" id="download-feedback-btn" onclick="downloadFeedbackData()"
        style="color:white; text-decoration:none; font-size:13px; font-weight:600; display:none; background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px;">Download Feedback</a>
      <a href="account.html" class="account-circle" title="My Account">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="like.html" class="like-icon" title="Favorites">
        ❤️
        <span id="like-count">0</span>
      </a>
    </div>
  </nav>

  <div style="max-width: 1280px; margin: 0 auto;">
    <a href="javascript:history.back()" class="back-btn" id="backBtn">← Back</a>
  </div>

  <div class="cuisine-header">
    <h2 id="cuisine-title" class="cuisine-title">Select a Cuisine</h2>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Filter dish...">
      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="Veg">🟢 Veg</option>
        <option value="Non-Veg">🔴 Non-Veg</option>
        <option value="Both">🟡 Both</option>
      </select>
    </div>
  </div>

  <div class="card-container" id="dish-list"></div>

  <footer>
    <p>© 2026 Foodopedia. Discover culinary traditions across the globe.</p>
  </footer>

  <script src="js/data.js"></script>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const selectedCuisine = params.get("cuisine");

    const title = document.getElementById("cuisine-title");
    const container = document.getElementById("dish-list");
    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");

    if (!selectedCuisine) {

      title.innerText = "Select a Cuisine";
      searchInput.style.display = "none";
      typeFilter.style.display = "none";

      const uniqueCuisines = [...new Set(foods.map(f => f.cuisine))];

      container.innerHTML = uniqueCuisines.map(c => {
        const flagPath = `assets/images/${c.toLowerCase()}/${c.toLowerCase()}_flag.jpeg`;
        
        return `
          <div class="card" onclick="location.href='cuisine.html?cuisine=${c}'">
            <img src="${flagPath}" loading="lazy" decoding="async" onerror="this.src=window.getImagePath([])" alt="${c} Cuisine">
            <h3>${c} Cuisine</h3>
          </div>
        `;
      }).join("");

    } else {

      title.innerText = selectedCuisine + " Cuisine";

      let cuisineFoods = foods.filter(f => f.cuisine === selectedCuisine);
      window.currentFoods = cuisineFoods;

      function renderFoods(list) {

        let likedItems = getLikedFoods();

        if (list.length === 0) {
          container.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color: var(--text-muted); font-size:16px;'>No dishes found matching your filter.</p>";
          return;
        }

        container.innerHTML = list.map(f => {
          const isLiked = likedItems.includes(f.id);

          return `
            <div class="card">
              <span 
                class="like-btn ${isLiked ? 'liked' : 'not-liked'}"
                onclick="toggleLike(${f.id}, event)">
                <svg viewBox="0 0 24 24" class="heart-icon ${isLiked ? 'liked' : ''}">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
              </span>

              <div onclick="location.href='food.html?id=${f.id}'">
                <img src="${getImagePath(f.images)}" alt="${f.name}" loading="lazy" decoding="async" onerror="this.src=window.getImagePath([])">
                <h3>${f.name}</h3>
              </div>
            </div>
          `;
        }).join("");
      }

      window.renderFoods = renderFoods;

      function applyFilters() {
        const searchVal = searchInput.value.toLowerCase();
        const typeVal = typeFilter.value;

        let filtered = [];
        cuisineFoods.forEach(f => {
          if (f.name.toLowerCase().includes(searchVal)) {
            if (typeVal === "all" || f.type === typeVal) {
              filtered.push(f);
            }
          }
          if (f.variations) {
            f.variations.forEach(v => {
              if (v.name.toLowerCase().includes(searchVal)) {
                if (typeVal === "all" || f.type === typeVal) {
                  filtered.push({ ...v, type: f.type, cuisine: f.cuisine });
                }
              }
            });
          }
        });

        window.currentFoods = filtered;
        renderFoods(window.currentFoods);
      }

      searchInput.addEventListener("input", applyFilters);
      typeFilter.addEventListener("change", applyFilters);

      renderFoods(cuisineFoods);
    }
  </script>

</body>
</html>
