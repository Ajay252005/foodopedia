<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your Foodopedia user profile and preferences.">
  <title>My Account | Foodopedia</title>
  <script>
    if (!sessionStorage.getItem('foodopedia_current_user')) {
      window.location.href = 'auth.html';
    }
  </script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/account.js"></script>
  <script src="js/countries.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .account-container {
      max-width: 620px;
      margin: 40px auto;
      background: var(--surface);
      padding: 40px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
    }
    
    .account-container h2 {
      margin-top: 0;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 30px;
      font-family: 'Outfit', sans-serif;
      font-size: 30px;
      font-weight: 800;
    }
    
    .form-group {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
    }
    
    .form-group label {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
      font-size: 14px;
    }
    
    .form-group input, .form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      background-color: var(--surface);
      transition: all 0.2s ease;
      height: 48px;
    }
    
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .form-group input:disabled, .form-group select:disabled {
      background: #f8fafc;
      color: #64748b;
      cursor: not-allowed;
      border-color: #e2e8f0;
    }

    .btn-row {
      display: flex;
      gap: 14px;
      margin-top: 35px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-edit {
      background: var(--text-main);
      color: white;
      flex: 1;
      min-width: 140px;
    }
    .btn-edit:hover { background: #1e293b; }

    .btn-save {
      background: #10b981;
      color: white;
      flex: 1;
      min-width: 140px;
      display: none;
    }
    .btn-save:hover { background: #059669; }

    .btn-logout {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-light);
      flex: 1;
      min-width: 110px;
    }
    .btn-logout:hover { background: #e2e8f0; }

    .btn-delete-trigger {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
      flex: 1;
      min-width: 140px;
    }
    .btn-delete-trigger:hover { 
      background: var(--primary); 
      color: white;
    }

    #delete-confirm-section {
      display: none;
      margin-top: 30px;
      padding: 24px;
      background: #fff5f5;
      border-radius: var(--radius-md);
      border: 1px dashed var(--primary);
      text-align: center;
    }

    #delete-confirm-section p {
      color: var(--primary);
      font-size: 14px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .btn-delete-final {
      background: var(--primary);
      color: white;
      width: 100%;
    }

    .avatar-section {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 25px;
      cursor: pointer;
    }
    
    .avatar-circle {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      background: #f1f5f9;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .avatar-section:hover .avatar-circle {
      transform: scale(1.04);
      box-shadow: 0 10px 25px rgba(255, 59, 48, 0.2);
    }
    
    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .avatar-edit-btn {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: var(--primary);
      border: 3px solid white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: none; /* Hidden by default until Edit Profile is clicked */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s ease;
    }
    
    .avatar-edit-btn:hover {
      transform: scale(1.15);
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
    }
    
    .modal-content {
      background-color: white;
      margin: 8% auto;
      padding: 30px;
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      animation: modalFadeIn 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 15px;
    }
    
    .modal-header h3 {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 700;
    }
    
    .close-modal {
      font-size: 28px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      transition: 0.2s;
    }
    
    .close-modal:hover {
      color: var(--text-main);
    }
    
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 16px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px;
    }
    
    .avatar-option {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s ease;
      object-fit: cover;
    }
    
    .avatar-option:hover {
      transform: scale(1.08);
      border-color: var(--primary);
    }
    
    .avatar-option.selected {
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      margin-top: 60px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border-light);
    }
  </style>
</head>
<body>

<nav class="main-nav">
  <a href="index.html" class="logo" style="color: inherit; text-decoration: none;">FOODOPEDIA</a>

  <div style="display:flex; align-items:center; gap:16px;">
    <a href="account.html" class="account-circle" title="My Account">
      <svg viewBox="0 0 24 24" width="22" height="22" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 4-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </a>
    <a href="like.html" class="like-icon" title="Favorites">
      ❤️
      <span id="like-count">0</span>
    </a>
  </div>
</nav>

<div style="max-width: 1280px; margin: 0 auto;">
  <a href="javascript:history.back()" class="back-btn" id="backBtn">← Back</a>
</div>

<div class="account-container">
  <div class="avatar-section">
    <div class="avatar-circle">
      <img id="user-avatar" src="assets/images/default-food.jpg" onerror="this.src='assets/images/default-food.jpg'" alt="Avatar">
    </div>
    <button type="button" class="avatar-edit-btn" id="avatar-edit-trigger" title="Change Avatar">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="white"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
  </div>

  <h2>My Account Profile</h2>
  
  <div id="avatar-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Choose your Avatar</h3>
        <span class="close-modal" id="close-avatar-modal">&times;</span>
      </div>
      <div class="avatar-grid" id="avatar-options-grid"></div>
    </div>
  </div>
  
  <form id="account-form">
    <div style="display:flex; gap:15px; margin-bottom:22px;">
      <div class="form-group" style="flex:1; margin-bottom:0;">
        <label>First Name</label>
        <input type="text" id="acc-firstname" disabled required>
      </div>
      <div class="form-group" style="flex:1; margin-bottom:0;">
        <label>Last Name</label>
        <input type="text" id="acc-lastname" disabled required>
      </div>
    </div>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="acc-email" disabled>
    </div>
    <div class="form-group">
      <label>Mobile Number</label>
      <input type="text" id="acc-mobile" disabled>
    </div>
    <div class="form-group">
      <label>Country of Origin</label>
      <select id="acc-country" disabled required>
        <option value="">Select Country</option>
      </select>
    </div>
    
    <div class="btn-row">
      <button type="button" class="btn btn-edit" id="edit-btn">Edit Profile</button>
      <button type="submit" class="btn btn-save" id="save-btn">Save Changes</button>
      <button type="button" class="btn btn-logout" onclick="logoutUser()">Logout</button>
      <button type="button" class="btn btn-delete-trigger" id="delete-trigger-btn">Delete Account</button>
    </div>

    <div id="delete-confirm-section">
      <p>⚠️ Enter your password to permanently delete your profile:</p>
      <div class="form-group">
        <input type="password" id="delete-password-confirm" placeholder="Enter password to confirm">
      </div>
      <button type="button" class="btn btn-delete-final" id="delete-final-btn">Permanently Delete Account</button>
    </div>
  </form>
</div>

<footer>
  <p>© 2026 Foodopedia. Account & Security Center.</p>
</footer>

</body>
</html>
