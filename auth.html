<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or register for Foodopedia - your global culinary encyclopedia.">
  <title>Foodopedia | Authentication</title>
  <script>
    if (sessionStorage.getItem('foodopedia_current_user')) {
      window.location.href = 'index.html';
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Auth Specific Styles over and above style.css */
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: var(--font-family, 'Plus Jakarta Sans', sans-serif);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Cinematic Background copied from index.html */
    .auth-bg-grid {
      position: fixed; /* Fixed so it doesn't scroll with content */
      top: -15%;
      left: -15%;
      width: 130%;
      height: 130%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      animation: cinematicPan 20s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
      z-index: 1;
    }

    .auth-bg-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      filter: contrast(1.1) saturate(1.2);
    }

    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.95) 100%);
      z-index: 2;
    }

    @keyframes cinematicPan {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.08) translate(-1.5%, -1.5%); }
    }

    @media (max-width: 768px) {
      .auth-bg-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(6, 1fr);
      }
      .intro-logo-text {
        font-size: 60px !important;
        letter-spacing: 6px !important;
      }
      .intro-subtext {
        font-size: 16px !important;
        top: calc(50% + 45px) !important;
      }
    }

    @media (max-width: 480px) {
      .auth-bg-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(10, 1fr);
      }
      .auth-container {
        width: 95% !important;
        padding: 25px 20px !important;
        margin: 20px auto !important;
      }
      .two-col {
        flex-direction: column;
        gap: 0;
      }
      .intro-logo-text {
        font-size: 40px !important;
        letter-spacing: 4px !important;
      }
      .intro-subtext {
        font-size: 14px !important;
        top: calc(50% + 35px) !important;
        white-space: normal !important;
        width: 80%;
      }
    }

    /* Auth Container */
    .auth-container {
      position: relative;
      z-index: 3;
      width: 400px;
      max-width: 90%;
      margin: 40px auto;
      background: rgba(0, 0, 0, 0.75);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      transition: opacity 1s, transform 1s;
    }

    .auth-container h2 {
      color: white;
      text-align: center;
      margin-top: 0;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #ccc;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
      transition: 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #e83b3b;
      background: rgba(255,255,255,0.15);
    }
    
    .form-group select option {
      background: #222;
      color: white;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      background: #e83b3b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .auth-btn:hover {
      background: #d63030;
    }

    .switch-mode {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    .switch-mode a {
      color: #e83b3b;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .switch-mode a:hover {
      text-decoration: underline;
    }

    /* Toast Notification */
    .auth-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      z-index: 10000;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      animation: slideIn 0.5s forwards;
    }
    .auth-toast.success { background: #28a745; }
    .auth-toast.error { background: #dc3545; }
    .auth-toast.fade-out { animation: fadeOut 0.5s forwards; }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      to { opacity: 0; }
    }

    .intro-logo-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      color: #e83b3b;
      font-size: 85px;
      font-weight: 900;
      letter-spacing: 12px;
      text-align: center;
      opacity: 0;
      animation: popIn 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      text-shadow: 0px 4px 15px rgba(0,0,0,0.8);
      white-space: nowrap;
      pointer-events: none;
    }

    .intro-subtext {
      position: fixed;
      top: calc(50% + 65px);
      left: 50%;
      transform: translate(-50%, 0);
      z-index: 4;
      color: #ddd;
      font-size: 22px;
      text-align: center;
      opacity: 0;
      font-weight: 400;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeInSub 2s ease 1.5s forwards;
      text-shadow: 0px 2px 8px rgba(0,0,0,0.9);
      white-space: nowrap;
      pointer-events: none;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes fadeInSub {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Optional Field styling */
    .optional-label {
      font-size: 12px;
      color: #888;
      font-style: italic;
    }
    
    .two-col {
      display: flex;
      gap: 15px;
    }
    .two-col .form-group {
      flex: 1;
    }
    
    #signup-section, #otp-section {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Background Grid -->
  <div class="auth-bg-grid">
    <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1499028344343-cd173ffc68a9?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1482049016688-2d3e1b311543?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1467003909585-2f8a72700288?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1543352634-99a5d50ae78e?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1476224203421-9ac39bcb3327?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1504754524776-8f4f37790ca0?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1478145046317-39f10e56b5e9?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1484834762280-66a18a5a8f0b?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1565299507177-b0ac66763828?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
    <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?q=80&w=400&auto=format&fit=crop" loading="lazy" decoding="async" alt="food">
  </div>
  <div class="auth-overlay"></div>

  <div id="intro-text-group">
    <div class="intro-logo-text">FOODOPEDIA</div>
    <div class="intro-subtext">A website for all the foodies around the world</div>
  </div>

  <!-- Form Container -->
  <div class="auth-container" id="auth-container" style="opacity: 0; pointer-events: none; transform: translateY(20px);">
    <h2>FOODOPEDIA</h2>

    <div id="form-container">
      <!-- Login Section -->
      <div id="login-section">
        <form id="login-form">
          <div class="form-group">
            <label>Email ID or Mobile No.</label>
            <input type="text" id="login-identifier" required placeholder="Enter email or mobile">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required placeholder="Enter password">
          </div>
          <button type="submit" class="auth-btn">Login</button>
        </form>
        <div class="switch-mode">
          New to Foodopedia? <a onclick="switchMode('signup')">Sign Up Now</a>
        </div>
      </div>

      <!-- Signup Section -->
      <div id="signup-section">
        <form id="signup-form">
          <div class="two-col">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" id="signup-firstname" required placeholder="John">
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" id="signup-lastname" required placeholder="Doe">
            </div>
          </div>
          
          <div class="form-group">
            <label>Country of Origin *</label>
            <input type="text" id="signup-country" list="country-list" required placeholder="e.g. India" onchange="updatePrefix()">
            <datalist id="country-list">
              <!-- Populated by countries.js -->
            </datalist>
          </div>
          
          <div class="form-group">
            <label>Mobile Number *</label>
            <div style="display:flex; gap:10px;">
              <input type="text" id="signup-prefix" readonly style="width: 70px; background: rgba(255,255,255,0.05);" placeholder="+??">
              <input type="tel" id="signup-mobile" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit number" style="flex:1;">
            </div>
          </div>
          
          <div class="form-group">
            <label>Email ID *</label>
            <input type="email" id="signup-email" required placeholder="john@example.com">
          </div>

          <div class="form-group">
            <label>Password *</label>
            <input type="password" id="signup-password" required placeholder="Create a strong password">
          </div>
          
          <div class="form-group">
            <label>Where did you hear about us? <span class="optional-label">(Optional)</span></label>
            <select id="signup-source">
              <option value="">Select an option</option>
              <option value="Instagram">Instagram</option>
              <option value="From a friend">From a friend</option>
              <option value="Google Search">Google Search</option>
              <option value="Other">Other</option>
            </select>
          </div>
          
          <button type="submit" class="auth-btn">Sign Up</button>
        </form>
        <div class="switch-mode">
          Already have an account? <a onclick="switchMode('login')">Login</a>
        </div>
      </div>
    </div>

  </div>

  <script src="js/countries.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
